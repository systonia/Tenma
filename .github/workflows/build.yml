# Tests on every pushed branch, and on a tag v* a release with the binaries and the Docker image on ghcr.io.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install pkgconf openssl@3 libpq icu4c libsodium libzip gmp oniguruma libpng jpeg-turbo webp freetype
      - uses: actions/cache@v4
        with:
          path: php-build/out
          key: php-macos-${{ hashFiles('php-build/build.sh') }}
      - run: test -f php-build/out/bin/php-config || php-build/build.sh
      - run: cargo build --release
      - run: cargo test --release
      # The binary embeds PHP: its license notice travels with it
      - run: |
          cp target/release/tenma .
          tar czf tenma-macos-arm64.tar.gz tenma NOTICE LICENSE-MIT LICENSE-APACHE
      - if: startsWith(github.ref, 'refs/tags/v')
        run: packaging/homebrew.sh "${GITHUB_REF_NAME#v}" tenma-macos-arm64.tar.gz tenma > tenma.rb
      - uses: actions/upload-artifact@v4
        with:
          name: tenma-macos-arm64
          path: |
            tenma-macos-arm64.tar.gz
            tenma.rb

  linux:
    strategy:
      # One architecture failing must not cancel the other's run
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tenma .
      # A one-line script proves the binary starts with the image's libraries
      - run: docker run --rm --entrypoint sh tenma -c 'echo "<?php echo PHP_VERSION;" > /tmp/v.php && tenma /tmp/v.php'
      - run: docker build --target build -t tenma-build . && docker run --rm -e USER=root tenma-build cargo test --release
      - run: |
          docker cp "$(docker create tenma)":/usr/local/bin/tenma tenma
          tar czf tenma-linux-${{ matrix.arch }}.tar.gz tenma NOTICE LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v4
        with:
          name: tenma-linux-${{ matrix.arch }}
          path: tenma-linux-${{ matrix.arch }}.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/systonia/tenma:${GITHUB_REF_NAME#v}-${{ matrix.arch }}
          docker tag tenma "$image" && docker push "$image"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=${GITHUB_REF_NAME#v}
          for tag in "$version" latest; do
            docker buildx imagetools create -t ghcr.io/systonia/tenma:$tag \
              ghcr.io/systonia/tenma:$version-x64 ghcr.io/systonia/tenma:$version-arm64
          done
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes tenma-*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # systonia/Homebrew-Tap: GITHUB_TOKEN may only write this repo, TAP_TOKEN is a token with write access to the tap
      - if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/systonia/Homebrew-Tap.git" tap
          mkdir -p tap/Formula && cp tenma.rb tap/Formula/tenma.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tenma.rb
          git commit -m "feat(tenma): update to ${GITHUB_REF_NAME#v}"
          git push
