[package]
name = "tenma"
version = "0.1.12"
edition = "2024"
description = "PHP with Node's execution model: one process, one event loop"
license = "MIT OR Apache-2.0"
homepage = "https://tenma.dev"
repository = "https://github.com/systonia/Tenma"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
mime_guess = "2"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
percent-encoding = "2"
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
reqwest = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "signal", "time", "sync", "fs", "io-util", "process"] }
tokio-postgres = "0.7"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[build-dependencies]
cc = "1"
